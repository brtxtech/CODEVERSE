<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CODEVERSE | Secure Career & Admin</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#141e32;--sub:#66728b;--primary:#4e52d7;--pale:#eef0ff;--ok:#13957f;--err:#ba4e5f;--warn:#b87925;--line:#e2e7f1;--page:#f5f7fb;--panel:#fff;--nav:#12182a}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.55 'DM Sans',system-ui,sans-serif}h1,h2,h3,h4{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.035em}h1{font-size:34px;line-height:1.15;margin:6px 0 14px}h2{font-size:21px;margin:0 0 10px}h3{font-size:17px;margin:0 0 7px}p{color:var(--sub)}a{color:var(--primary)}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:11px;background:var(--primary);color:white;padding:12px 16px;font-weight:700}.btn.secondary{background:#eef0ff;color:#393fb0}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.small{font-size:12px;padding:8px 12px}.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--nav);color:#b9c4d8;padding:30px 16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;overflow-y:auto}.logo{font:700 24px 'Space Grotesk';letter-spacing:-.065em;color:white;margin:0 10px 28px}.logo span{color:#adb5ff}.s-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#75849d;margin:16px 12px 8px}.nav{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;color:#c2cee1;background:none;border:0;font-weight:600}.nav:hover{background:#222e48}.nav.active{color:white;background:#303a63}.nav small{float:right;opacity:.7}.footer{margin-top:auto;border-top:1px solid #293751;padding-top:17px}.identity{color:#fff;margin:6px 10px}.identity small{color:#a7b5ce;display:block}.main{min-width:0;padding:30px clamp(20px,4vw,70px) 60px;max-width:1560px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:30px}.eyebrow{color:var(--primary);font-weight:800;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.badge{display:inline-block;padding:4px 9px;background:#edf0ff;color:#484ccc;border-radius:99px;font-size:11px;font-weight:700}.badge.ok{background:#def5ef;color:#087a67}.badge.bad{background:#ffe8ea;color:#aa3a54}.badge.warn{background:#fff0d7;color:#a65d12}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 6px 25px -22px #394d7c}.card p{margin:7px 0}.intro{max-width:800px;margin-bottom:25px}.muted{color:var(--sub)}.meter{height:8px;border-radius:9px;background:#e8eaf1;overflow:hidden;margin:11px 0}.meter i{display:block;height:100%;background:var(--ok);transition:width .2s}.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stage{background:#fff;border:1px solid var(--line);padding:18px;border-radius:14px;display:flex;gap:14px}.stage.locked{opacity:.60}.stage .number{flex:none;background:#eef0ff;color:var(--primary);border-radius:12px;display:grid;place-items:center;width:42px;height:42px;font-weight:800}.stage.done .number{background:#ddf5ec;color:#07866c}.stage h3{margin:0 0 5px}.stage p{margin:0 0 8px;font-size:12px}.stage .open{font-size:12px;color:var(--primary);font-weight:700}.focus{padding:24px;border:1px solid #cbd0ff;border-radius:17px;background:linear-gradient(135deg,#fff,#f1f2ff);margin-bottom:20px}.focus p{max-width:760px}.control{display:block;margin:13px 0}.control label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.control input,.control select,.control textarea{padding:13px;border:1px solid #ccd4e4;border-radius:10px;background:white;width:100%;color:var(--ink)}.result{margin-top:17px;padding:14px;border:1px solid #cfe1e0;border-radius:11px;background:#f0f9f6;color:#184f43}.warning{padding:13px;background:#fff5e9;border:1px solid #f0d6ac;border-radius:11px;color:#96601e;margin:12px 0}.locked-box{padding:25px;border:1px dashed #c8cfdf;border-radius:16px;text-align:center}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#e6eaff,transparent 40%),#f5f7fb}.auth-card{background:white;border:1px solid var(--line);border-radius:22px;max-width:520px;width:100%;padding:36px;box-shadow:0 35px 80px -50px #3d4b79}.auth-card h1{font-size:28px}.switch{display:flex;gap:8px;margin:22px 0}.switch button{flex:1}.status{margin:15px 0;color:var(--sub);font-size:12px;min-height:20px}.divider{height:1px;background:var(--line);margin:22px 0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--sub);font-weight:700;border-bottom:1px solid var(--line);padding:12px 7px}.table td{padding:12px 7px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.city{min-height:240px;border-radius:15px;background:linear-gradient(155deg,#1c2c48,#101726);position:relative;display:flex;align-items:flex-end;justify-content:space-around;gap:9px;padding:32px 18px 28px;perspective:640px;overflow:hidden}.building{--height:100px;--hue:#6571e2;position:relative;flex:1;max-width:75px;min-width:25px;height:var(--height);background:linear-gradient(100deg,color-mix(in srgb,var(--hue),#fff 15%),var(--hue));box-shadow:9px -8px 0 color-mix(in srgb,var(--hue),#000 34%);transform:skewY(-9deg);border:1px solid #ffffff1e}.building:before{content:'';position:absolute;top:-9px;left:4px;right:-7px;height:10px;background:color-mix(in srgb,var(--hue),#fff 45%);transform:skewX(-42deg)}.building span{position:absolute;bottom:-28px;font-size:8px;color:#d4e3ff;white-space:nowrap;left:0;transform:skewY(9deg)}.review{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.code{font:12px ui-monospace,monospace;background:#f5f6fa;border-radius:7px;padding:5px 8px}.right{margin-left:auto}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mobile-toggle{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stage-grid{grid-template-columns:1fr}}@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:none}.sidebar.open{display:flex}.mobile-toggle{display:inline-block}.main{padding:18px}.grid,.grid.two,.stage-grid{grid-template-columns:1fr}.auth-card{padding:24px}.topbar{margin:0 0 18px}}
</style></head><body><div id="app"></div><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const STAGES=[['Upload your CV','Sube tu CV y revisa las tecnologías identificadas.'],['Connect GitHub','Introduce un perfil GitHub público para construir tu ciudad de repositorios.'],['Review skill evidence','Inspecciona las señales reales y sus limitaciones.'],['Choose your career','Selecciona una trayectoria profesional.'],['Understand skill gaps','Revisa requisitos sin evidencias suficientes.'],['Build verifiable proof','Envía un repositorio con señales técnicas rastreables.'],['Track career readiness','Revisa tu evaluación: no es una probabilidad de contratación.']];
const ROLE={developer:'Developer',recruiter:'Recruiter',security_admin:'Security Administrator'};const $=id=>document.getElementById(id);
const state={client:null,session:null,me:null,page:'home',authMode:'login',roleRequested:'developer',message:'',mobile:false,github:[],alert:null,mfaRequired:false,mfaFactorId:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function iconText(n){return String(n).padStart(2,'0')};function flash(t){state.message=t;const el=$('message');if(el)el.textContent=t;else render()}
async function api(path,opts={}){const token=state.session?.access_token;if(!token)throw Error('Inicia sesión primero');const headers={Authorization:`Bearer ${token}`,...opts.headers};if(opts.body&&!(opts.body instanceof FormData))headers['Content-Type']='application/json';const r=await fetch(path,{...opts,headers});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:`HTTP ${r.status}`);return x}
async function refresh(){if(!state.session){state.me=null;state.mfaRequired=false;return}try{state.me=await api('/api/secure/me');state.mfaRequired=false}catch(e){state.me=null;state.mfaRequired=e.message.includes('MFA_AAL2_REQUIRED');state.message=e.message}}
function auth(){let signup=state.authMode==='signup';$('app').innerHTML=`<div class="auth"><section class="auth-card"><div class="eyebrow">CODEVERSE · SECURE ACCESS</div><h1>Tu carrera, respaldada por evidencias.</h1><p>Accede con tu cuenta. Los roles son permanentes y se validan en el servidor.</p><div class="switch"><button class="btn ${signup?'ghost':'secondary'}" id="loginMode">Iniciar sesión</button><button class="btn ${signup?'secondary':'ghost'}" id="signupMode">Crear cuenta</button></div>${signup?`<div class="control"><label>Nombre visible</label><input id="displayName" maxlength="120" autocomplete="name" placeholder="Nombre" /></div><div class="control"><label>Tipo de cuenta (se fija al registrarse)</label><select id="signupRole"><option value="developer">Developer — carrera y portfolio</option><option value="recruiter">Recruiter — candidatos con consentimiento</option></select></div>`:''}<div class="control"><label>Correo electrónico</label><input id="authEmail" type="email" autocomplete="email" placeholder="nombre@ejemplo.com" /></div><div class="control"><label>Contraseña</label><input id="authPassword" type="password" autocomplete="${signup?'new-password':'current-password'}" minlength="10" placeholder="Mínimo 10 caracteres" /></div><button class="btn" style="width:100%" id="authSubmit">${signup?'Crear cuenta':'Acceder'}</button><div class="divider"></div><div class="grid two"><button class="btn ghost" id="google">Continuar con Google</button><button class="btn ghost" id="github">Continuar con GitHub</button></div><p style="font-size:11px">Las nuevas cuentas creadas por OAuth entran como Developer. Para registrarte como Recruiter usa el formulario. Security Admin se asigna exclusivamente desde la administración de Supabase.</p><div id="message" class="status">${esc(state.message)}</div></section></div>`;
 $('loginMode').onclick=()=>{state.authMode='login';state.message='';auth()};$('signupMode').onclick=()=>{state.authMode='signup';state.message='';auth()};$('authSubmit').onclick=async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||password.length<10)return flash('Indica correo y contraseña de al menos 10 caracteres');try{if(signup){const role=$('signupRole').value;const r=await state.client.auth.signUp({email,password,options:{data:{requested_role:role,display_name:$('displayName').value.trim()}}});if(r.error)throw r.error;flash('Cuenta creada. Revisa tu email si Supabase exige confirmación. El rol queda fijado al registrarte.');}else{const r=await state.client.auth.signInWithPassword({email,password});if(r.error)throw r.error;state.session=r.data.session;await refresh();render()}}catch(e){flash(e.message)}};
 for(const provider of ['google','github'])$(provider).onclick=async()=>{try{const r=await state.client.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+'/secure'}});if(r.error)throw r.error}catch(e){flash(e.message)}};
}
function renderMFA(){
 $('app').innerHTML=`<div class="auth"><section class="auth-card"><div class="eyebrow">ADMINISTRATOR SECOND FACTOR</div><h1>Verify your administrator access</h1><p>Security administrators require Supabase Auth MFA AAL2. Set up an authenticator app or enter its current one-time code.</p><div id="mfaResult" class="status"></div><div id="mfaQr"></div><div class="control"><label>One-time 6-digit code</label><input id="totpCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="123456" /></div><div class="actions"><button class="btn secondary" id="mfaEnroll">Enroll TOTP</button><button class="btn" id="mfaVerify">Verify code</button><button class="btn ghost" id="mfaLogout">Log out</button></div></section></div>`;
 const status=t=>{if($('mfaResult'))$('mfaResult').textContent=t};
 $('mfaEnroll').onclick=async()=>{try{const r=await state.client.auth.mfa.enroll({factorType:'totp',friendlyName:'CODEVERSE Security Admin'});if(r.error)throw r.error;state.mfaFactorId=r.data.id;const qr=r.data.totp?.qr_code;if(qr)$('mfaQr').innerHTML=`<img alt="Scan this TOTP QR code with your authenticator app" style="max-width:190px" src="${esc(qr)}" />`;status('Scan QR, then verify the code. Store recovery information securely.')}catch(e){status(e.message)}};
 $('mfaVerify').onclick=async()=>{try{let factor=state.mfaFactorId;if(!factor){const r=await state.client.auth.mfa.listFactors();if(r.error)throw r.error;factor=(r.data.totp||[]).find(f=>f.status==='verified')?.id;}if(!factor)throw Error('Enroll a TOTP authenticator first');const challenge=await state.client.auth.mfa.challenge({factorId:factor});if(challenge.error)throw challenge.error;const verify=await state.client.auth.mfa.verify({factorId:factor,challengeId:challenge.data.id,code:$('totpCode').value.trim()});if(verify.error)throw verify.error;const latest=await state.client.auth.getSession();state.session=latest.data.session;await refresh();render()}catch(e){status(e.message)}};
 $('mfaLogout').onclick=async()=>{await state.client.auth.signOut();state.session=null;state.me=null;state.mfaRequired=false;render()};
}
function navButton(id,label,extra=''){return `<button class="nav ${state.page===id?'active':''}" data-page="${id}">${label}${extra}</button>`}
function shell(){const p=state.me.profile,role=p.role;const nav=role==='developer'?[navButton('home','⌂ &nbsp; Home'),navButton('profile','◉ &nbsp; My Profile'),navButton('journey','◎ &nbsp; Career Journey'),navButton('jobs',state.me.can_view_jobs?'▣ &nbsp; Job Opportunities':'▣ &nbsp; Job Opportunities',state.me.can_view_jobs?'':'<small>🔒</small>'),navButton('pipeline','⌘ &nbsp; Pipeline Studio')]:role==='recruiter'?[navButton('home','⌂ &nbsp; Home'),navButton('recruiter','▣ &nbsp; Consented Candidates')]:[navButton('home','⌂ &nbsp; Home'),navButton('admin','◈ &nbsp; Security Audit'),navButton('grafana','▥ &nbsp; Grafana Monitoring')];$('app').innerHTML=`<div class="app"><aside class="sidebar ${state.mobile?'open':''}"><div class="logo">CODE<span>VERSE</span></div><div class="s-label">Workspace / ${esc(ROLE[role])}</div>${nav.join('')}<div class="footer"><div class="identity">${esc(p.display_name||p.email||'CODEVERSE User')}<small>${esc(ROLE[role])} · Role locked</small></div>${navButton('settings','⚙ &nbsp; My Account')}<button class="nav" id="logout">⇥ &nbsp; Log out</button></div></aside><main class="main"><header class="topbar"><div><span class="eyebrow">CODEVERSE / ${esc(ROLE[role])}</span><div style="font-size:12px;color:var(--sub)">Identity verified by Supabase JWT</div></div><button class="btn ghost mobile-toggle" id="mobile">☰ Menu</button><span class="badge ok">Session active</span></header><section id="content"></section><p id="message" class="status">${esc(state.message)}</p></main></div>`;
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.mobile=false;state.message='';render()});$('logout').onclick=async()=>{await state.client.auth.signOut();state.session=null;state.me=null;state.page='home';state.message='';render()};if($('mobile'))$('mobile').onclick=()=>{state.mobile=!state.mobile;render()};}
const doneSteps=()=>new Set((state.me.steps||[]).filter(x=>x.status==='completed').map(x=>+x.step));
function stageEvidence(i){const data=(state.me.steps||[]).find(s=>+s.step===i)?.result||{};
 if(i===1)return `${esc(data.skills_detected||0)} claims detected · ${esc((data.technologies||[]).slice(0,8).join(', '))}`;
 if(i===2)return `${esc(data.public_repos_found||0)} repositories from ${esc(data.username||'GitHub')} · ${(data.repositories||[]).slice(0,4).map(r=>esc(r.name)).join(', ')}`;
 if(i===3)return 'Evidence limitations acknowledged; authorship not proven';
 if(i===4)return `Selected: ${esc(data.title||data.career||'Career')}`;
 if(i===5)return 'Gap review acknowledged';
 if(i===6)return `${esc(data.signals_found||0)} manifest signals · ${esc(data.repository||'')}. Authorship not verified`;
 return 'Evidence alignment interpretation acknowledged; not a hiring prediction';
}

function banner(title,desc,action=''){return `<div class="eyebrow">${esc(action||'WORKSPACE')}</div><h1>${title}</h1><p class="intro">${desc}</p>`}
function home(){const role=state.me.profile.role;if(role==='developer'){const done=doneSteps(),n=state.me.next_step;return banner('Tu próximo paso, con claridad.','Siete servicios, uno tras otro. Se desbloquean solo cuando el servidor confirma el anterior.','CAREER INTELLIGENCE')+`<div class="focus"><div class="inline"><span class="badge ${state.me.submitted?'ok':'warn'}">${state.me.submitted?'Journey submitted':`Step ${Math.min(n,7)} of 7`}</span><span class="badge">${done.size}/7 stages confirmed</span></div><div class="meter"><i style="width:${done.size/7*100}%"></i></div><h2>${state.me.submitted?'Ya puedes explorar oportunidades de empresas':n<8?'Continúa: '+STAGES[n-1][0]:'Todos los pasos completos: envía tu recorrido'}</h2><p>Las tarjetas se mantienen en Career Journey. En Home destacamos únicamente la próxima acción.</p><button class="btn" data-jump="${state.me.submitted?'jobs':'journey'}">${state.me.submitted?'Ver oportunidades':'Continuar mi recorrido'}</button></div><div class="grid two"><article class="card"><span class="eyebrow">PROFILE</span><h2>Tu identidad profesional</h2><p>Correo, Universidad, GitHub y repositorios públicos.</p><button class="btn secondary" data-jump="profile">Abrir perfil</button></article><article class="card"><span class="eyebrow">CAREER WORKSPACE</span><h2>Aprende con evidencias</h2><p>Repositorios, tecnologías, career profile y mejoras del portfolio.</p><button class="btn secondary" data-jump="journey">Ver servicios</button></article></div>`};if(role==='recruiter')return banner('Espacio de selección responsable','Solo se muestran candidatos que comparten su perfil con consentimiento explícito.','RECRUITER')+`<div class="card"><h2>Sin candidatos compartidos</h2><p>No mostramos CVs privados ni repositorios sin autorización.</p><button class="btn" data-jump="recruiter">Abrir candidatos</button></div>`;return banner('Centro de seguridad','Audita autorización, acceso denegado y progresos. Grafana utiliza métricas reales de esta API.','SECURITY OPERATIONS')+`<div class="grid two"><div class="card"><h2>Eventos de acceso</h2><p>Permisos, intentos no autorizados y revisiones de incidentes.</p><button class="btn" data-jump="admin">Abrir auditoría</button></div><div class="card"><h2>Grafana</h2><p>Métricas Prometheus y reglas de alertas.</p><button class="btn" data-jump="grafana">Abrir monitorización</button></div></div>`}
function journey(){const done=doneSteps(),next=state.me.next_step,submitted=state.me.submitted;return banner('Career Journey','Realiza los siete servicios consecutivamente. Cada uno muestra los resultados y requiere validación; no puedes adelantar pasos moviendo sliders manualmente.','SEVEN EVIDENCE STAGES')+`<div class="stage-grid">${STAGES.map(([title,desc],i)=>{const s=i+1,complete=done.has(s),locked=s>next;return `<article class="stage ${complete?'done':locked?'locked':''}"><div class="number">${complete?'✓':iconText(s)}</div><div style="flex:1"><h3>${esc(title)}</h3><p>${esc(desc)}</p><span class="badge ${complete?'ok':locked?'':'warn'}">${complete?'100% · Completed':locked?'Locked':'0% · Next action'}</span> ${!locked&&!complete?`<button class="btn small secondary" data-step="${s}">Abrir servicio</button>`:''}${complete?`<div class="open">${stageEvidence(s)}</div>${s===2?'<button class="btn small ghost" data-jump="profile">Repository city →</button>':''}`:''}</div></article>`}).join('')}</div>${next===8&&!submitted?`<div class="focus" style="margin-top:22px"><h2>Ready to submit</h2><p>Los siete pasos están completados. Envía el recorrido para habilitar Job Opportunities.</p><button class="btn" id="submitJourney">Submit completed journey</button></div>`:submitted?`<div class="result">Recorrido enviado. <button class="btn small" data-jump="jobs">Abrir Job Opportunities</button></div>`:''}<div id="stageDetail"></div>`}
async function openStep(i){const options=[['backend','Backend Software Engineer'],['fullstack','Full-stack Engineer'],['telecom','Telecom Software Engineer'],['ml','AI / ML Engineer'],['devops','Cloud / DevOps Engineer']];const instructions=[`<form id="cvForm"><p>Extraeremos tecnologías del PDF/DOCX/TXT y almacenaremos las señales en tu espacio privado de Supabase.</p><div class="control"><label>Upload CV · 2 MB maximum</label><input id="cvFile" type="file" accept=".pdf,.docx,.txt" required /></div><button class="btn" type="submit">Analyze and complete step 1</button></form>`,`<form id="ghForm"><p>Utilizamos únicamente repositorios públicos. Su presencia no demuestra autoría personal.</p><div class="control"><label>Introduce your GitHub link</label><input id="ghUrl" placeholder="https://github.com/username" required /></div><button class="btn">Generate repository city & complete step 2</button></form><div id="cityResults"></div>`,`<p>Los archivos de dependencias permiten detectar herramientas utilizadas, pero no demuestran por sí solos dominio técnico ni contribuciones personales.</p><label class="control"><input type="checkbox" id="ack" style="width:auto"/> He revisado las señales de mi CV y mis repositorios y entiendo sus limitaciones.</label><button id="ackSubmit" class="btn">Confirm review</button>`,`<p>Selecciona un perfil profesional. El resultado es una recomendación de trayectoria, no una vacante activa.</p><div class="control"><label>Target career</label><select id="careerChoice">${options.map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><button class="btn" id="careerSubmit">Select career and continue</button>`,`<p>Revisa los requisitos faltantes o poco demostrados. "Sin evidencia" no significa "sin competencia".</p><div class="warning">Revisa Docker, Kubernetes, pruebas automáticas, y tu elección de carrera comparándolos con tu evidencia actual.</div><label><input id="ack" type="checkbox"/> He revisado mis oportunidades de mejora.</label><div class="actions"><button class="btn" id="ackSubmit">Confirm gap review</button></div>`,`<p>Sube una URL de repositorio público que contenga configuraciones técnicas trazables. Las señales detectadas no prueban autoría.</p><div class="control"><label>Repository</label><input id="proofRepo" placeholder="owner/repository" /></div><button class="btn" id="proofSubmit">Scan proof and continue</button>`,`<p>La evaluación refleja evidencias observables, no la probabilidad de conseguir empleo.</p><label><input id="ack" type="checkbox"/> He revisado la interpretación y sus límites.</label><div class="actions"><button class="btn" id="ackSubmit">Finish readiness review</button></div>`];const el=$('stageDetail');if(!el)return;el.innerHTML=`<div class="card" style="margin-top:20px"><div class="eyebrow">STEP ${iconText(i)} / 07</div><h2>${esc(STAGES[i-1][0])}</h2><p>${esc(STAGES[i-1][1])}</p>${instructions[i-1]}<div class="status" id="stepStatus"></div></div>`;el.scrollIntoView({behavior:'smooth',block:'nearest'});const status=e=>$('stepStatus').textContent=e;const complete=async(path,body)=>{try{const res=await api(path,{method:'POST',body:body instanceof FormData?body:JSON.stringify(body)});status(`✓ Completado paso ${res.step}. Actualizando...`);await refresh();state.message=`Paso ${i} confirmado en Supabase.`;render()}catch(e){status(e.message)}};
 if(i===1)$('cvForm').onsubmit=async e=>{e.preventDefault();const f=$('cvFile').files[0];if(!f)return status('Selecciona un archivo');const form=new FormData();form.append('file',f);await complete('/api/secure/journey/cv',form)};
 if(i===2)$('ghForm').onsubmit=async e=>{e.preventDefault();const gh=$('ghUrl').value.trim();status('Comprobando los repositorios públicos…');try{let owner=gh.replace(/^https:\/\/github\.com\//,'').replace(/\/$/,'');const list=await fetch('/api/github/repositories?owner='+encodeURIComponent(owner)).then(r=>r.json());const repos=list.repositories||[];if(repos.length)showCity(repos);await complete('/api/secure/journey/github',{github_url:gh})}catch(e){status(e.message)}};
 if([3,5,7].includes(i))$('ackSubmit').onclick=()=>complete(`/api/secure/journey/steps/${i}`,{acknowledge:!!$('ack').checked});
 if(i===4)$('careerSubmit').onclick=()=>complete('/api/secure/journey/steps/4',{career:$('careerChoice').value});
 if(i===6)$('proofSubmit').onclick=()=>complete('/api/secure/journey/steps/6',{repository:$('proofRepo').value.trim()});
}
function showCity(repos){let html=`<h3>Repository city · ${repos.length} public repositories</h3><div class="city">${repos.slice(0,12).map((r,i)=>`<div class="building" style="--height:${Math.max(48,Math.min(180,45+(r.size||0)/30))}px;--hue:${['#6675ea','#299eaa','#b27acb','#d19b55'][i%4]}"><span title="${esc(r.full_name)}">${esc((r.name||'repo').slice(0,9))}</span></div>`).join('')}</div><p>Edificios ilustrativos según tamaño del repositorio; no representan nivel profesional. Idiomas observados: ${esc([...new Set(repos.map(r=>r.language).filter(Boolean))].join(', ')||'desconocidos')}.</p>`;const el=$('cityResults');if(el)el.innerHTML=html;}
function profile(){const p=state.me.profile;return banner('Tu perfil profesional','Controla tus datos. Tu rol fue asignado al registrarte y no puede modificarse en esta pantalla.','MY PROFILE')+`<div class="grid two"><div class="card"><h2>Identity</h2><div class="control"><label>Email · verificado por proveedor</label><input value="${esc(p.email)}" disabled /></div><div class="control"><label>Role · immutable</label><input value="${esc(ROLE[p.role])}" disabled /></div><div class="control"><label>Name</label><input id="profileName" value="${esc(p.display_name)}" /></div><div class="control"><label>University</label><input id="profileUni" value="${esc(p.university)}" /></div><div class="control"><label>GitHub username</label><input id="profileGitHub" value="${esc(p.github_username)}" /></div><button class="btn" id="saveProfile">Save profile</button></div><div class="card"><h2>Repository portfolio</h2><p>Esta vista usa repositorios públicos; puedes consultar los edificios en la etapa GitHub.</p><div id="profileRepos"><span class="muted">${p.github_username?'Pulsa «Load repositories» para ver la ciudad':'Añade el usuario GitHub en tu perfil.'}</span></div><div class="actions"><button id="loadRepos" class="btn secondary" ${p.github_username?'':'disabled'}>Load repositories</button></div></div></div>`}
function jobs(){return banner('Job Opportunities','Esta sección solo está disponible después de completar y enviar los siete servicios. Las empresas son destinos reales, pero las posiciones mostradas son sugerencias: no anuncios verificados.','EMPLOYER DISCOVERY')+`<div id="jobsContent" class="card">Loading access policy…</div>`}
function admin(){return banner('Security Access Audit','Eventos reales emitidos por la API: permisos permitidos/denegados, avance del recorrido y revisión de incidentes. No incluye automáticamente fallos de login ocurridos dentro de Supabase Auth.','ADMIN · GRAFANA-READY')+`<div id="overview" class="grid" style="margin-bottom:17px"><div class="card">Cargando métricas…</div></div><div class="card"><div class="inline"><h2>Eventos de seguridad</h2><button class="btn secondary small right" id="reloadEvents">Refresh</button></div><div style="overflow-x:auto" id="events"><p>Cargando eventos…</p></div></div>`}
function grafana(){return banner('Grafana Monitoring','Grafana y Prometheus corren en Docker en localhost, con acceso independiente y anónimo deshabilitado.','OBSERVABILITY')+`<div class="card"><h2>Security operations dashboards</h2><p>Se incluyen métricas Prometheus, gráficos de denegaciones y un dashboard provisionado. Grafana requiere iniciar sesión con el administrador de Grafana; ser Security Admin de CODEVERSE no concede automáticamente acceso a Grafana.</p><div class="actions"><a class="btn" href="http://127.0.0.1:3000/d/codeverse-security" target="_blank" rel="noopener noreferrer">Open Grafana on localhost</a><a class="btn secondary" href="http://127.0.0.1:9090" target="_blank" rel="noopener noreferrer">Open Prometheus</a></div><p style="font-size:12px">Sin Docker Compose iniciado no se mostrarán paneles. Consulta README_SECURITY.md.</p></div>`}
function pipeline(){return banner('Pipeline Studio','Conecta URLs de portales profesionales y prepara envíos de candidaturas. Solo salida: no leer inbox, no scraping de mensajes, no envío automático sin consentimiento.','WORKFLOW STUDIO')+`<div class="grid two"><div class="card"><h2>Career URL connector</h2><p>Importa manualmente una URL de oferta HTTPS desde la web del empleador.</p><div class="control"><label>URL</label><input placeholder="https://company.com/careers/role" /></div><button class="btn secondary" disabled>Server MCP · Pending configuration</button></div><div class="card"><h2>Gmail outbound</h2><p>Para enviar una candidatura, el usuario debe autorizar un permiso de envío mínimo. No se solicita acceso al buzón entrante.</p><button class="btn secondary" disabled>Connect Gmail Send-only · Not deployed</button><p class="warning">No hay acceso ni lectura de Gmail. El envío real requiere un conector MCP autorizado.</p></div></div>`}
function settings(){return banner('Configuración de cuenta','La política RBAC se aplica en el servidor. Tu perfil no puede auto-ascender a administrador.','ACCOUNT & PRIVACY')+`<div class="card"><h2>Role: ${esc(ROLE[state.me.profile.role])}</h2><p>Correo: ${esc(state.me.profile.email)}</p><p>El rol es inmutable desde la interfaz. El administrador se asigna exclusivamente mediante un procedimiento privilegiado sobre Supabase.</p><button class="btn ghost" id="accountLogout">Cerrar sesión</button></div>`}
function recruiter(){return banner('Consented Candidates','Esta rama queda separada del recorrido de desarrollador y de los registros de seguridad.','RECRUITER')+`<div class="card" id="recruiterContent">No hay candidatos compartidos.</div>`}
async function hydrate(){if(state.page==='profile'){if($('saveProfile'))$('saveProfile').onclick=async()=>{try{await api('/api/secure/profile',{method:'PATCH',body:JSON.stringify({display_name:$('profileName').value,university:$('profileUni').value,github_username:$('profileGitHub').value})});await refresh();flash('Perfil guardado. Rol sin cambios.')}catch(e){flash(e.message)}};if($('loadRepos'))$('loadRepos').onclick=async()=>{try{const res=await fetch('/api/github/repositories?owner='+encodeURIComponent(state.me.profile.github_username));const j=await res.json();if(!res.ok)throw Error(j.detail||'GitHub error');$('profileRepos').innerHTML=`<p>${j.count||0} repositorios públicos</p><div class="city">${(j.repositories||[]).slice(0,10).map((r,i)=>`<div class="building" style="--height:${Math.max(46,Math.min(170,45+(r.size||0)/30))}px;--hue:${['#6475de','#24a399','#a980df'][i%3]}"><span>${esc((r.name||'repo').slice(0,9))}</span></div>`).join('')}</div><div style="margin-top:12px">${(j.repositories||[]).slice(0,12).map(r=>`<div class="review"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.full_name)}</a><small>${esc(r.language||'Unknown')} · ${r.stars||0} stars</small></div>`).join('')}</div>`}catch(e){flash(e.message)}}}
 if(state.page==='journey'){$('content').querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>openStep(+b.dataset.step));if($('submitJourney'))$('submitJourney').onclick=async()=>{try{await api('/api/secure/journey/submit',{method:'POST'});await refresh();state.page='jobs';render()}catch(e){flash(e.message)}}}
 if(state.page==='jobs'){try{const res=await api('/api/secure/jobs');$('jobsContent').innerHTML=`<div class="warning">${esc(res.note)}</div><div class="grid two">${res.companies.map(j=>`<article class="card"><h3>${esc(j.company)}</h3><p>Suggested positions: ${esc(j.suggested_positions.join(', '))}</p><a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">Open official careers site ↗</a></article>`).join('')}</div>`}catch(e){$('jobsContent').innerHTML=`<div class="locked-box"><h2>🔒 Job Opportunities locked</h2><p>${esc(e.message)}</p><button class="btn" data-jump="journey">Complete Career Journey</button></div>`;bindJumps()}}
 if(state.page==='admin'){const load=async()=>{try{const [a,b]=await Promise.all([api('/api/secure/admin/overview'),api('/api/secure/admin/events?limit=50')]);$('overview').innerHTML=`<div class="card"><div class="eyebrow">Recent events</div><h1>${a.events_sampled}</h1></div><div class="card"><div class="eyebrow">Denied</div><h1>${a.by_outcome.denied||0}</h1></div><div class="card"><div class="eyebrow">Open reviews</div><h1>${a.pending_review}</h1></div>`;$('events').innerHTML=`<div class="warning">${esc(b.scope)}</div><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Role</th><th>Action</th><th>Outcome</th><th>Review</th></tr></thead><tbody>${b.events.map(e=>`<tr><td>${esc((e.created_at||'').slice(0,19))}</td><td><span class="code">${esc((e.actor_id||'anonymous').slice(0,8))}</span></td><td>${esc(e.role)}</td><td>${esc(e.action)}</td><td><span class="badge ${e.outcome==='denied'?'bad':'ok'}">${esc(e.outcome)}</span></td><td>${e.review_status==='closed'?'Closed':`<button class="btn small secondary" data-review="${esc(e.id)}">Review</button>`}</td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{const why=prompt('Motivo de revisión, al menos cinco caracteres:');if(!why)return;try{await api(`/api/secure/admin/events/${b.dataset.review}/review`,{method:'POST',body:JSON.stringify({status:'closed',reason:why})});await load()}catch(e){flash(e.message)}})}catch(e){flash(e.message)}};await load();if($('reloadEvents'))$('reloadEvents').onclick=load;}
 if(state.page==='recruiter'){try{const r=await api('/api/secure/recruiter');$('recruiterContent').textContent=r.note}catch(e){flash(e.message)}}if($('accountLogout'))$('accountLogout').onclick=$('logout').onclick;}
function bindJumps(){document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.page=b.dataset.jump;render()})}
function render(){if(state.session&&state.mfaRequired){renderMFA();return}if(!state.session||!state.me){auth();return}if(state.me.profile.role==='security_admin'){location.replace('/admin');return}shell();const role=state.me.profile.role;const permitted=role==='developer'?['home','profile','journey','jobs','pipeline','settings']:role==='recruiter'?['home','recruiter','settings']:['home','admin','grafana','settings'];if(!permitted.includes(state.page))state.page='home';const map={home,journey,profile,jobs,admin,grafana,pipeline,settings,recruiter};$('content').innerHTML=map[state.page]();bindJumps();hydrate()}
async function boot(){try{const r=await fetch('/api/secure/config');if(!r.ok)throw Error('Configura Supabase en .env.security y ejecuta la migración.');const c=await r.json();state.client=createClient(c.supabase_url,c.supabase_anon_key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const s=await state.client.auth.getSession();state.session=s.data.session;await refresh();state.client.auth.onAuthStateChange((_event,session)=>{const was=state.session?.access_token;state.session=session;if(!session){state.me=null;render()}else if(session.access_token!==was){setTimeout(async()=>{await refresh();render()},0)}});render()}catch(e){$('app').innerHTML=`<div class="auth"><section class="auth-card"><h1>Setup requerido</h1><p>${esc(e.message)}</p><p>Los accesos no se activan sin Supabase configurado. No hay login simulado ni modo admin inseguro.</p><a href="/api/docs">API documentation</a></section></div>`}}
boot();
</script></body></html>
