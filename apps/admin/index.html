<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODEVERSE: security console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#070B16;--panel:#0E1424;--panel2:#131B30;--ink:#EAF0FF;--mute:#98A5C3;--line:#232D48;--pri:#7C8CFF;--ok:#3FD9C0;--warn:#F5B454;--bad:#FF7A8A;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "IBM Plex Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}h2{font-size:17px;margin-bottom:12px}
a{color:var(--pri)}button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px clamp(16px,3vw,36px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,11,22,.92);backdrop-filter:blur(8px);z-index:5}
.logo{font:700 19px "Bricolage Grotesque"}.logo small{color:var(--mute);font:500 14px "IBM Plex Sans";margin-left:8px}
.live{display:inline-flex;gap:7px;align-items:center;color:var(--mute);font-size:13px}.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}.live.off i{background:var(--warn);box-shadow:none}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--pri);color:#0B1020;border:0;border-radius:10px;padding:8px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:4px 11px;font-size:13px}
main{padding:22px clamp(16px,3vw,36px) 60px;max-width:1320px;margin:0 auto}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:16px}
.kpi,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}.kpi small{color:var(--mute);display:block}.kpi b{font:700 30px "Bricolage Grotesque";font-variant-numeric:tabular-nums}.kpi.bad b{color:var(--bad)}
.grid{display:grid;gap:14px;grid-template-columns:1.5fr 1fr;margin-bottom:14px}.grid3{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fl input,.fl select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}.fl input{flex:1;min-width:180px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th{text-align:left;color:var(--mute);font-weight:500;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.d td{background:#1A1220}code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:500}.t-ok{background:#10281F;color:var(--ok)}.t-bad{background:#2A1620;color:var(--bad)}.t-w{background:#2E2410;color:var(--warn)}
.empty{color:var(--mute);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.auth{max-width:420px;margin:12vh auto;padding:0 18px}.auth .card{padding:26px}.fld{display:flex;flex-direction:column;gap:5px;margin:12px 0}.fld input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.msg{margin-top:12px;color:var(--bad)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(460px,92vw)}dialog::backdrop{background:rgba(5,8,16,.6)}dialog textarea,dialog select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 12px}
@media(max-width:900px){.grid,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">CODEVERSE<small>Security console</small></div><div class="act" id="act" hidden><span class="live" id="live"><i></i><span id="stamp">Loading…</span></span><button class="btn ghost sm" id="rf">Refresh</button><button class="btn ghost sm" id="csv">Export events CSV</button><button class="btn ghost sm" id="so">Sign out</button></div></header>
<main id="app"></main>
<dialog id="dlg"><h2>Review event</h2><label for="st">Status</label><select id="st"><option value="investigating">Investigating</option><option value="closed">Closed</option></select><label for="why">Reason (5+ characters, kept in the audit trail)</label><textarea id="why" rows="3" maxlength="500"></textarea><div class="row"><button class="btn ghost" id="no">Cancel</button><button class="btn" id="yes">Save review</button></div></dialog>
<script type="module">
import{createClient}from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb,A=null,E=[],timer=null,rev=null,F={o:'',r:'',q:''};
async function api(p,o={}){const{data}=await sb.auth.getSession();const r=await fetch(p,{...o,headers:{Authorization:'Bearer '+(data.session?.access_token||''),...(o.body?{'Content-Type':'application/json'}:{})}});let j=null;try{j=await r.json()}catch{}if(!r.ok){const e=new Error(typeof j?.detail=='string'?j.detail:'Request failed ('+r.status+')');e.status=r.status;throw e}return j}
function login(m=''){$('#act').hidden=true;clearInterval(timer);$('#app').innerHTML=`<div class="auth"><div class="card"><h2>Administrator sign in</h2><p style="color:var(--mute);margin:0">Only accounts promoted to Security Admin can open this console. Accounts with two-step verification must finish at <a href="/secure">/secure</a> first.</p><div class="fld"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div><div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn" id="go">Sign in</button><div class="msg" id="m" role="alert">${esc(m)}</div></div></div>`;
 $('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)return $('#m').textContent=r.error.message;boot()}}
const chart=h=>{const mx=Math.max(1,...h.map(x=>x.allowed+x.denied));const w=24*22;return `<div class="tw"><svg viewBox="0 0 ${w} 150" width="100%" style="min-width:520px" role="img" aria-label="Events per hour, last 24 hours">${h.map((x,i)=>{const a=x.allowed/mx*110,d=x.denied/mx*110;return `<rect x="${i*22+3}" y="${120-a-d}" width="16" height="${a}" rx="2" fill="#3FD9C0"/><rect x="${i*22+3}" y="${120-d}" width="16" height="${d}" rx="2" fill="#FF7A8A"/>${i%4==0?`<text x="${i*22+11}" y="140" text-anchor="middle" font-size="10" fill="#98A5C3">${x.hour}</text>`:''}`}).join('')}</svg></div><p style="color:var(--mute);margin:6px 0 0"><span class="tag t-ok">allowed</span> <span class="tag t-bad">denied</span> events per hour, UTC</p>`};
function paint(){const a=A,names=['CV','GitHub','Evidence','Career','Gaps','Proof','Readiness'],mx=Math.max(1,a.accounts.developers);
 $('#stamp').textContent='Live · updated '+new Date(a.generated_at).toLocaleTimeString();const o=a.observability;
 $('#app').innerHTML=`<div class="kpis"><div class="kpi"><small>Events, last 24h</small><b>${a.events_in_window}</b></div><div class="kpi ${a.denied_in_window?'bad':''}"><small>Denied</small><b>${a.denied_in_window}</b></div><div class="kpi"><small>Open reviews</small><b>${a.open_reviews}</b></div><div class="kpi"><small>Developers</small><b>${a.accounts.developers}</b></div><div class="kpi"><small>Journeys submitted</small><b>${a.journeys_submitted}</b></div><div class="kpi"><small>Completion rate</small><b>${a.completion_percent}%</b></div></div>
 <div class="grid"><div class="card"><h2>Access activity</h2>${a.events_in_window?chart(a.hourly):'<div class="empty">No API events in the last 24 hours.</div>'}</div><div class="card"><h2>Most denied actions</h2>${a.top_denied.length?a.top_denied.map(x=>`<div class="row" style="margin-bottom:9px"><code>${esc(x.action)}</code><b>${x.count}</b></div>`).join(''):'<div class="empty">No denials recorded.</div>'}</div></div>
 <div class="grid3"><div class="card"><h2>Developer journey funnel</h2>${a.funnel.map((f,i)=>`<div style="margin-bottom:11px"><div class="row"><span>${i+1}. ${names[i]}</span><b>${f.users}</b></div><div class="bar"><i style="width:${f.users/mx*100}%"></i></div></div>`).join('')}<div class="row"><span>Submitted</span><b>${a.journeys_submitted}</b></div><div class="bar"><i style="width:${a.journeys_submitted/mx*100}%;background:var(--ok)"></i></div></div>
 <div class="card"><h2>Accounts and monitoring</h2><div class="row"><span>Developers</span><b>${a.accounts.developers}</b></div><div class="row"><span>Recruiters</span><b>${a.accounts.recruiters}</b></div><div class="row"><span>Security admins</span><b>${a.accounts.admins}</b></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="act">${o.grafana?`<a class="btn" href="${esc(o.grafana)}" target="_blank" rel="noopener noreferrer">Open Grafana</a>`:''}${o.prometheus?`<a class="btn ghost" href="${esc(o.prometheus)}" target="_blank" rel="noopener noreferrer">Prometheus</a>`:''}</div>${o.grafana||o.prometheus?'':'<p style="color:var(--mute);margin:0">Grafana is not linked. Set CODEVERSE_GRAFANA_URL and CODEVERSE_PROMETHEUS_URL on the server.</p>'}<p style="color:var(--mute);font-size:13px">Source: your Supabase tables. Supabase Auth sign-in failures are not included here.</p></div></div>
 <div class="card"><h2>Security events</h2><div class="fl"><input id="q" type="search" placeholder="Search action or actor" aria-label="Search events" value="${esc(F.q)}"><select id="fo" aria-label="Outcome"><option value="">All outcomes</option><option value="denied">Denied</option><option value="allowed">Allowed</option></select><select id="fr" aria-label="Role"><option value="">All roles</option><option>developer</option><option>recruiter</option><option>security_admin</option><option>anonymous</option></select></div><div class="tw" id="ev"></div></div>`;
 $('#fo').value=F.o;$('#fr').value=F.r;$('#q').oninput=e=>{F.q=e.target.value;ev()};$('#fo').onchange=e=>{F.o=e.target.value;ev()};$('#fr').onchange=e=>{F.r=e.target.value;ev()};ev()}
function ev(){const q=F.q.toLowerCase(),L=E.filter(e=>(!F.o||e.outcome==F.o)&&(!F.r||e.role==F.r)&&(!q||(e.action+' '+(e.actor_id||'')).toLowerCase().includes(q)));
 $('#ev').innerHTML=L.length?`<table><thead><tr><th>Time (UTC)</th><th>Actor</th><th>Role</th><th>Action</th><th>Outcome</th><th>Detail</th><th>Review</th></tr></thead><tbody>${L.map(e=>`<tr class="${e.outcome=='denied'?'d':''}"><td>${esc((e.created_at||'').slice(0,19).replace('T',' '))}</td><td><code>${esc((e.actor_id||'anonymous').slice(0,8))}</code></td><td>${esc(e.role)}</td><td>${esc(e.action)}</td><td><span class="tag ${e.outcome=='denied'?'t-bad':'t-ok'}">${esc(e.outcome)}</span></td><td style="max-width:260px;overflow-wrap:anywhere;color:var(--mute)">${esc(e.detail?JSON.stringify(e.detail):'')}</td><td>${e.review_status=='closed'?'<span class="tag t-ok">Closed</span>':e.review_status=='investigating'?`<span class="tag t-w">Investigating</span> <button class="btn ghost sm" data-r="${esc(e.id)}">Update</button>`:`<button class="btn ghost sm" data-r="${esc(e.id)}">Review</button>`}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No events match. Real events appear here as people use the platform.</div>';
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rev=b.dataset.r;$('#why').value='';$('#dlg').showModal()})}
async function load(){try{[A,{events:E}]=await Promise.all([api('/api/secure/admin/analytics'),api('/api/secure/admin/events?limit=100')]);$('#live').classList.remove('off');paint()}catch(e){$('#live').classList.add('off');$('#stamp').textContent='Offline: '+e.message}}
async function boot(){try{const me=await api('/api/secure/me');if(me.profile.role!=='security_admin'){$('#app').innerHTML='<div class="auth"><div class="card"><h2>Administrator access required</h2><p style="color:var(--mute)">This account is not a Security Admin. Roles are assigned by a privileged database update, never from this page.</p><a class="btn" href="/start">Back to CODEVERSE</a></div></div>';$('#act').hidden=true;return}
 $('#act').hidden=false;await load();clearInterval(timer);timer=setInterval(load,30000)}catch(e){login(e.status==403?'Extra verification is needed. Continue at /secure.':e.status==401?'':e.message)}}
$('#rf').onclick=load;$('#so').onclick=async()=>{await sb.auth.signOut();login()};$('#no').onclick=()=>$('#dlg').close();
$('#yes').onclick=async()=>{const why=$('#why').value.trim();if(why.length<5)return;try{await api(`/api/secure/admin/events/${rev}/review`,{method:'POST',body:JSON.stringify({status:$('#st').value,reason:why})});$('#dlg').close();await load()}catch(e){alert(e.message)}};
$('#csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['time','actor','role','action','outcome','review'],...E.map(e=>[e.created_at,e.actor_id||'',e.role,e.action,e.outcome,e.review_status||''])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='codeverse-security-events.csv';a.click()};
(async()=>{try{const c=await (await fetch('/api/secure/config')).json();sb=createClient(c.supabase_url,c.supabase_anon_key,{auth:{persistSession:true,autoRefreshToken:true}});const{data}=await sb.auth.getSession();data.session?boot():login()}catch{$('#app').innerHTML='<div class="auth"><div class="card"><h2>Setup required</h2><p>Supabase is not configured on the server. See START_SECURE_CODEVERSE.md.</p></div></div>'}})();
</script>
</body>
</html>
