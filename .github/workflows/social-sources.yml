name: Social source collector (optional)
on:
  workflow_dispatch:
  schedule:
    - cron: '18 6 * * *'
permissions:
  contents: read
jobs:
  collect:
    if: ${{ vars.ENABLE_SOCIAL_COLLECTOR == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: integrations/social-sources/requirements.txt
      - run: python -m pip install -r integrations/social-sources/requirements.txt
      - name: Gather public GitHub and configured private Slack sources
        run: python integrations/social-sources/social_scraper.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_IDS: ${{ vars.SLACK_CHANNEL_IDS }}
