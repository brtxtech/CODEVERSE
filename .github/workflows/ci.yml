name: CODEVERSE CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend · tests & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Secure portal syntax check
        run: python ops/check_portal_js.py
      - name: Build Vite app
        run: npm run build
      - name: Upload static site build
        uses: actions/upload-artifact@v4
        with:
          name: codeverse-vite-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
  backend:
    name: Backend · Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt pytest httpx
      - name: Validate Grafana and Prometheus YAML
        run: |
          python -m pip install PyYAML
          python - <<'PY2'
          from pathlib import Path
          import yaml
          files = [Path('ops/compose.security.yml'), Path('ops/prometheus/prometheus.yml'),
                   Path('ops/grafana/provisioning/alerting/security-alerts.yml'),
                   Path('ops/grafana/provisioning/datasources/prometheus.yml'),
                   Path('ops/grafana/provisioning/dashboards/codeverse.yml')]
          for f in files:
              assert isinstance(yaml.safe_load(f.read_text()), dict), f
          print('Grafana and Prometheus YAML: OK')
          PY2
      - name: Run backend tests
        run: python -m pytest -q tests_python tests_ops
